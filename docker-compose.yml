version: '3.8'

services:
  bugreplay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bugreplay-ai
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - API_BASE_URL=http://localhost:5000
      - JWT_SECRET=production_jwt_secret_bugreplay_ai_at_least_32_chars_long
      - JWT_EXPIRES_IN=7d
      - DB_PATH=/app/server/data/bugreplay.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - CORS_ORIGIN=http://localhost:5000,http://localhost:5173
    volumes:
      - bugreplay-data:/app/server/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  bugreplay-data:
    name: bugreplay-sqlite-storage
